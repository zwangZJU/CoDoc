[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

# 后端：tsx 运行 Fastify + Yjs 协同房间（容器内 1234）
[program:codoc-server]
command=sh -c "cd /app/server && npm run start"
directory=/app/server
environment=PORT="1234",HOST="0.0.0.0",NODE_ENV="production"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/codoc-server.out.log
stderr_logfile=/var/log/codoc-server.err.log

# 前端：nginx 静态托管 + 反代（容器内 80）
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/nginx.out.log
stderr_logfile=/var/log/nginx.err.log
